<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #f3efe6;
        --ink: #1c1a16;
        --muted: #6d685d;
        --line: #e0d9ca;
        --accent: #d93a2b;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1d1b17;
          --ink: #f2eee5;
          --muted: #9b9588;
          --line: #2f2c26;
          --accent: #ff5b4b;
        }
      }
      body {
        margin: 0;
        width: 260px;
        padding: 14px;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.4 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 13px;
        margin-bottom: 12px;
      }
      header img {
        width: 20px;
        height: 20px;
      }
      #title {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: grid;
        gap: 6px;
      }
      button {
        font: inherit;
        font-weight: 600;
        text-align: left;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1.5px solid var(--line);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--muted);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      #status {
        margin: 10px 0 0;
        font-size: 13px;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header><img src="icons/32.png" alt="" />EasyYTubeDownloader</header>
    <p id="title"></p>
    <div class="actions" id="actions" hidden>
      <button class="primary" data-preset="best" data-i18n="popupBest"></button>
      <button data-preset="1080" data-i18n="popup1080"></button>
      <button data-preset="mp3" data-i18n="popupMp3"></button>
    </div>
    <p id="status"></p>
    <a href="https://github.com/eeeyyeeezz/EasyYTubeDownloader/releases/latest" target="_blank" data-i18n="popupNoApp"></a>
    <script src="popup.js"></script>
  </body>
</html>
