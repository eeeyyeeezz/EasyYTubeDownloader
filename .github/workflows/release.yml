name: Release

# Push a tag like v0.1.0 to build installers for every platform and attach
# them, together with the browser extension, to a draft GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Create the draft through the API: it returns the id directly. A freshly
        # created draft is "untagged" for a while, so looking it up by tag fails.
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f name="EasyYTubeDownloader $TAG" \
            -F body=@.github/release-notes.md \
            -F draft=true \
            --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  app:
    needs: create-release
    name: App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Linux arm64
            os: ubuntu-22.04-arm
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; tauri-action then uploads latest.json,
          # which installed apps poll to update themselves.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Update bundles are only built here, where the signing key exists,
          # so building from source works without it.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  extension:
    needs: create-release
    runs-on: ubuntu-latest
    # Job-level so the `if:` of the AMO step can see whether the secrets exist.
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Package
        working-directory: extension
        run: |
          npm ci
          npm run package
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" extension/artifacts/*.zip --clobber --repo "$GITHUB_REPOSITORY"
      # Optional: submit the new version to addons.mozilla.org. The very first
      # submission has to be made by hand on AMO; after that, add the
      # AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets to enable this.
      - name: Submit to Firefox Add-ons
        if: ${{ env.AMO_JWT_ISSUER != '' }}
        working-directory: extension
        run: npx web-ext sign -s dist/firefox --channel listed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
